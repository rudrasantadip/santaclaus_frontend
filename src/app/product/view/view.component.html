<section class="product-detail-page">

  <div class="gallery">
    <div class="thumbs">
      <button type="button" class="thumb" *ngFor="let img of images" [class.on]="img.imageUrl === selectedImage" (click)="selectImage(img.imageUrl)">
        <img [src]="img.imageUrl" alt="" />
      </button>
    </div>

    <div class="stage" (mousemove)="tilt($event)" (mouseleave)="untilt($event)">
      <div class="main-image">
        <img [src]="selectedImage" [alt]="product.productName" />
      </div>
    </div>
  </div>

  <div class="details">

    <h1 class="product-title display">{{ product.productName }}</h1>

    <p class="product-sub">{{ product.description }}</p>

    <div class="rating">
      <svg *ngFor="let s of stars" viewBox="0 0 24 24" width="24" height="24" [class.off]="s > rating" aria-hidden="true">
        <path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.1l-5.7 3.2 1.2-6.4L2.8 9.5l6.4-.8L12 2.8Z"/>
      </svg>
      <span>(1,911 reviews)</span>
    </div>

    <div class="price">
      ₹ {{calculateDiscount(product.price,product.discountPercent)}}
      <span class="strike">₹{{product.price}}</span>
    </div>

    <div class="delivery" role="radiogroup" aria-label="Delivery option">
      <button type="button" class="box" role="radio" *ngFor="let d of deliveryOptions" [class.active]="selectedDelivery === d.name" [attr.aria-checked]="selectedDelivery === d.name" (click)="selectedDelivery = d.name">
        <h4>{{ d.name }}</h4>
        <p>{{ d.note }}</p>
      </button>
    </div>

    <div class="actions">
      <button class="btn btn-coral add">Add to Cart</button>
      <button class="btn btn-wine buy">Buy Now</button>
    </div>

  </div>

</section>

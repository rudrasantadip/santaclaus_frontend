<section class="product-detail-page">

  <!-- LEFT : IMAGE GALLERY -->
  <div class="gallery">
    <div class="thumbs">
      <img *ngFor="let img of images" (click)="selectImage(img)" [src]="img" />
    </div>

    <div class="main-image">
      <img [src]="selectedImage"/>
    </div>
  </div>

  <!-- RIGHT : PRODUCT INFO -->
  <div class="details">

    <h1 class="product-title">
      {{ product.productName }}
    </h1>

    <p class="product-sub">
      {{ product.description }}
    </p>

    <div class="rating">
      ★★★★☆ <span>(1,911 reviews)</span>
    </div>

    <div class="price">
      ₹ 1499
      <span class="strike">₹1799</span>
    </div>

    <!-- VARIANTS -->
    <!-- <div class="section">
      <label>Size</label>
      <div class="options">
        <span *ngFor="let s of sizes" class="chip">{{ s }}</span>
      </div>
    </div> -->
<!-- 
    <div class="section">
      <label>Color</label>
      <div class="colors">
        <span
          *ngFor="let c of colors"
          class="color"
          [style.background]="c"
        ></span>
      </div>
    </div> -->

    <!-- DELIVERY -->
    <div class="delivery">
      <div class="box active">
        <h4>Pickup</h4>
        <p>Ready within 2 hours</p>
      </div>
      <div class="box">
        <h4>Delivery</h4>
        <p>As soon as today</p>
      </div>
      <div class="box">
        <h4>Shipping</h4>
        <p>Get it by Mar 22</p>
      </div>
    </div>

    <!-- CTA -->
    <div class="actions">
      <button class="add">Add to Cart</button>
      <button class="buy">Buy Now</button>
    </div>

  </div>

</section>

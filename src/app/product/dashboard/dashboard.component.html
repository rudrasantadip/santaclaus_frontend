<div class="product-dashboard">

  <!-- FLOATING FILTER BAR -->
  <div class="filter-bar">
    <span 
    class="filter-chip" 
    (click)="setCategory('All')"
    [class.active]="activeCategory === 'All'"
    >All</span>
    <span
      class="filter-chip"
      *ngFor="let cat of categoryNames"
      [class.active]="activeCategory === cat"
      (click)="setCategory(cat)"
    >
      {{ cat }}
    </span>
  </div>

  <h2 class="dash-title">Featured Products</h2>

  <div class="product-grid">

    <div
      class="product-card"
      *ngFor="let product of filteredProducts; let i = index"
      [style.transform]="'translateY(' + (i % 3 === 0 ? 0 : i % 3 === 1 ? 25 : 45) + 'px)'"
    >
      <div class="img-wrap">
        <img
          [src]="product.productImage"
          [alt]="product.productName"
        />
      </div>

      <div class="info">
        <h3 class="name">{{ product.productName }}</h3>
        <p class="desc">{{ product.description }}</p>
      </div>

      <div class="footer-row">
        <span class="price">₹1400</span>
        <span class="category">{{product.categoryName}}</span>
      </div>

      <button class="explore-btn" (click)="redirect('/product/view',product.productName)">Explore</button>
    </div>

  </div>
</div>

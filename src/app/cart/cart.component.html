<section class="cart-page">

  <header class="cart-header">
    <h1 class="display">My Cart</h1>
  </header>

  <div class="cart-layout">

    <div class="cart-items">

      <div class="cart-row">
        <div class="product-thumb" aria-hidden="true"><i></i></div>

        <div class="product-details">
          <h3 class="display">Golang Notes</h3>
          <p class="meta">Beginner friendly</p>
          <p class="stock">In Stock</p>

          <div class="actions">
            <button type="button">Edit</button>
            <button type="button">Remove</button>
            <button type="button">Save for Later</button>
          </div>
        </div>

        <div class="price-each">
          <span class="label">Each</span>
          <span class="price">₹40</span>
        </div>

        <div class="quantity">
          <select aria-label="Quantity">
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select>
        </div>

        <div class="total">
          <span class="label">Total</span>
          <span class="price">₹40</span>
        </div>
      </div>

      <div class="items-footer">
        <span>1 Item</span>
        <strong>₹1120</strong>
      </div>

    </div>

    <aside class="summary">

      <div class="promo">
        <label for="promo">Promo code</label>
        <div class="promo-box">
          <input id="promo" type="text" placeholder="Promo Code">
          <button type="button">Apply</button>
        </div>
      </div>

      <div class="summary-line"><span>Shipping</span><span>TBD</span></div>
      <div class="summary-line"><span>Discount</span><span>₹0</span></div>
      <div class="summary-line"><span>Tax</span><span>TBD</span></div>

      <div class="summary-total">
        <span>Estimated Total</span>
        <h2 class="display">₹40</h2>
      </div>

      <button class="btn btn-coral checkout-btn">Secure Checkout</button>

      <p class="shipping-note">You're <strong>₹300</strong> away from free shipping</p>

    </aside>

  </div>

</section>

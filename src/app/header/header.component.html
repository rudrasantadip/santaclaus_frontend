<header class="header">
  <div class="logo">
    <img src="assets/images/santa_claus.png" alt="SantaClaus Logo">
  </div>

  <nav class="nav-links">
    <a routerLink="/home">Home</a>
    <a routerLink="/product">Products</a>
    <a href="#">About</a>

  <button *ngIf="!isLoggedin()" class="cta-btn" (click)="redirectTo('/auth/login')">Login</button>

</header>

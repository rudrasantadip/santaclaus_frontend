<header class="header">
  <a class="brand" routerLink="/home" aria-label="Santa Claus Marketplace home">
    <span class="badge"><img src="assets/images/santa_claus.png" alt=""></span>
    <span class="wordmark display">Santa Claus</span>
  </a>

  <nav class="nav-links" aria-label="Primary">
    <a routerLink="/home" routerLinkActive="active">Home</a>
    <a routerLink="/product" routerLinkActive="active">Products</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="buttons">
    <button class="icon-btn" type="button" aria-label="Open cart" (click)="redirectTo('/cart')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8Z"/>
        <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
      </svg>
    </button>
    <button *ngIf="!isLoggedin()" class="pill-btn" type="button" (click)="redirectTo('/auth/login')">Login</button>
    <button *ngIf="isLoggedin()" class="pill-btn" type="button" (click)="logout()">Logout</button>
    <span *ngIf="isLoggedin()" class="avatar" aria-label="Signed in">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>
      </svg>
    </span>
  </div>
</header>

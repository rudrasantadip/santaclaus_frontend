<div class="login-wrapper">

  <div class="login-card">

    <h2 class="title">Welcome</h2>
    <p class="subtitle">Enter your credentials to continue</p>

    <form #loginForm="ngForm" >

      <div class="input-field">
        <label>Username</label>
        <input type="text" name="username" [(ngModel)]="user.username" placeholder="Enter your username" />
      </div>

      <div class="input-field">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="user.password" placeholder="Enter your password" />
      </div>

      <button class="btn login-btn" [disabled]="loading" (click)="login()">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Loading</span>
      </button>

      <!-- 🔻 NEW Google Login -->
      <div class="google-section">
        <p class="or">or</p>
        <button class="google-btn">
          <img src="assets/images/google.svg" alt="Google Logo" />
          Sign in with Google
        </button>
      </div>

      <div class="links">
        <a class="forgot" href="#">Forgot Password?</a>
        <a class="signup" routerLink="/auth/register">Create a new account</a>
      </div>

    </form>
  </div>

</div>

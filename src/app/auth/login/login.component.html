<div class="auth-stage">

  <div class="auth-art">
    <div class="ghost-text" aria-hidden="true">Noel</div>
    <div class="bauble copper" style="--size:110px; right:14%; top:12%;"></div>
    <div class="bauble wine" style="--size:70px; right:46%; top:4%; animation-delay:-3s;"></div>
    <h1 class="display">Welcome</h1>
  </div>

  <div class="auth-form-side">
    <form #loginForm="ngForm">

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" [(ngModel)]="user.username" placeholder="Enter your username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" [(ngModel)]="user.password" placeholder="Enter your password" autocomplete="current-password" />
      </div>

      <button class="btn btn-coral" [disabled]="loading" (click)="login()">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Loading</span>
      </button>

      <div class="auth-divider">or</div>

      <button type="button" class="google-btn">
        <img src="assets/images/google.svg" alt="" />
        Sign in with Google
      </button>

      <div class="auth-links">
        <a href="#">Forgot Password?</a>
        <a routerLink="/auth/register">Create a new account</a>
      </div>

    </form>
  </div>

</div>

<div class="register-wrapper">

  <div class="register-card">

    <h2 class="title">Create Your Account</h2>
    <p class="subtitle">Join the Santa Marketplace Family</p>

    <form class="register-grid">

      <div class="input-field">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" />
      </div>

      <div class="input-field">
        <label>Username</label>
        <input type="text" placeholder="Choose a username" />
      </div>

      <div class="input-field">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" />
      </div>

      <div class="input-field">
        <label>Password</label>
        <input type="password" placeholder="Create a password" />
      </div>

      <div class="input-field full">
        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter password" />
      </div>

      <button class="btn register-btn full">Register</button>

      <div class="google-section full">
        <p class="or">or</p>
        <button class="google-btn">
          <img src="assets/images/google.svg" alt="Google Logo" />
          Sign Up with Google
        </button>
      </div>

      <div class="links full">
        <p>Already have an account?</p>
        <a class="login" routerLink="/auth/login">Login here</a>
      </div>

    </form>
  </div>

</div>

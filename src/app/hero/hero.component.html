<section
  class="hero-neo"
  (mousemove)="onMouseMove($event)"
>
  <!-- PARALLAX BACKGROUND -->
  <div class="bg-layer layer-1" [style.transform]="bg1"></div>
  <div class="bg-layer layer-2" [style.transform]="bg2"></div>
  <div class="snow"></div>

  <!-- LEFT CONTENT -->
  <div class="hero-left" [style.transform]="leftTransform">
    <h1 class="neo-title">
      Santa Claus<br />
      <span>Marketplace</span>
    </h1>

    <p class="neo-tagline">
      Where Christmas Spirit<br />
      <strong>Meets Commerce</strong>
    </p>

    <p class="neo-desc">
      Sell handmade wonders, festive creations & bold ideas.
      <br />
      <strong>Custom Santa-powered projects welcome.</strong>
    </p>
  </div>

  <!-- FLOATING CTA ORBIT -->
  <div class="hero-right" [style.transform]="rightTransform">
    <button class="neo-btn seller">Become a Seller</button>
    <button class="neo-btn browse">View Products</button>
    <button class="neo-btn santa">Hire Santa</button>
  </div>
</section>
